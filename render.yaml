services:
  - type: web
    name: pdf-processor
    env: python
    buildCommand: pip install -r python-service/requirements.txt
    startCommand: cd python-service && PYTHONPATH=.. gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 900 --worker-class gthread --log-level info wsgi:application
    envVars:
      - key: PORT
        value: 5000
      # Matches python-service/Dockerfile; Render otherwise picks its own default version
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHONUNBUFFERED
        value: 1
      # Shared secret; must match INTERNAL_API_SECRET on the Next.js app
      - key: INTERNAL_API_SECRET
        sync: false
      # Comma-separated callback hosts, e.g. moneta.example.com
      - key: CALLBACK_ALLOWED_HOSTS
        sync: false

  - type: worker
    name: pdf-worker
    env: python
    buildCommand: pip install -r python-service/requirements.txt
    startCommand: cd python-service && PYTHONPATH=.. python worker.py
    envVars:
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHONUNBUFFERED
        value: 1
